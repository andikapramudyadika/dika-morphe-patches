name: Verify and build experimental Morphe bundle

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scheduler and integration tests
        run: node --test tests/*.test.cjs
      - name: JavaScript syntax
        run: |
          node --check patches/src/main/resources/greatday8/core.js
          node --check patches/src/main/resources/greatday8/runtime.js
      - name: Python syntax
        run: python -m py_compile scripts/check_target.py

  bundle:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      - name: Compile Android-compatible patch bundle
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.MORPHE_PACKAGES_TOKEN || github.token }}
        run: gradle :patches:buildAndroid --no-daemon --stacktrace
      - name: Confirm actual bundle contents
        run: |
          python - <<'PY'
          import pathlib, zipfile
          bundles = list(pathlib.Path('patches/build/libs').glob('*.mpp'))
          bundles = [p for p in bundles if not p.name.endswith(('-sources.mpp', '-javadoc.mpp'))]
          assert len(bundles) == 1, bundles
          with zipfile.ZipFile(bundles[0]) as archive:
              names = set(archive.namelist())
              for required in ['classes.dex', 'greatday8/core.js', 'greatday8/runtime.js', 'greatday8/targets.properties']:
                  assert required in names, required
          print('Verified:', bundles[0])
          PY
      - name: Upload experimental bundle
        uses: actions/upload-artifact@v4
        with:
          name: dika-greatday8-experimental-${{ github.sha }}
          path: |
            patches/build/libs/*.mpp
          if-no-files-found: error
          retention-days: 30
